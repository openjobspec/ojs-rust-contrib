[package]
name = "ojs-actix"
version = "0.5.0"
description = "Actix-web middleware and app data integration for OJS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["jobs", "queue", "actix", "ojs"]
categories = ["web-programming"]
readme = "README.md"
publish = false

autoexamples = false

[dependencies]
ojs = { workspace = true }
actix-web = { version = ">=4.15, <5", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-http = { version = ">=3.13.5, <4", default-features = false }
time = { version = ">=0.3.55, <0.4", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "signal"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
actix-web = { version = ">=4.15, <5", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-rt = "2.13"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
