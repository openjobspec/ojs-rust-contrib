[package]
name = "ojs-axum-example"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/worker.rs"

[dependencies]
ojs = { version = "0.5.0", features = ["reqwest-transport"] }
ojs-axum = { version = "0.5.0", path = ".." }
axum = ">=0.8.9, <0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
